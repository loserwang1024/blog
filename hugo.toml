baseURL = 'https://loserwang.github.io/blog'
languageCode = 'zh-cn'
title = '技术笔记'
theme = 'PaperMod'
enableRobotsTXT = true
buildDrafts = false
enableEmoji = true

[params]
  author = 'loserwang'
  description = '记录学习与技术成长'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowToc = true
  TocOpen = false
  defaultTheme = 'auto'
  disableThemeToggle = false

[params.homeInfoParams]
  Title = '技术笔记'
  Content = '记录学习与技术成长'

[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.4
  minMatchCharLength = 0
  keys = ['title', 'permalink', 'summary', 'content']

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = 'monokai'
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.main]]
    name = '首页'
    url = '/'
    weight = 10
  [[menu.main]]
    name = '文章'
    url = '/posts/'
    weight = 20
  [[menu.main]]
    name = '分类'
    url = '/categories/'
    weight = 30
  [[menu.main]]
    name = '标签'
    url = '/tags/'
    weight = 40
  [[menu.main]]
    name = '搜索'
    url = '/search/'
    weight = 50
  [[menu.main]]
    name = '关于'
    url = '/about/'
    weight = 60
